name: SRL Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
        run: python bot.py/bot.py
      - name: Commit state
        run: |
          git config user.name "SRL Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json bot_log.txt || true
          git commit -m "Bot update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push || true
